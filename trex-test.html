<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T-Rex Test - IRLISE</title>
<style>
  html,body{margin:0;height:100%;background:#9fd0f0;overflow:hidden;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #hud{position:fixed;left:12px;top:12px;color:#fff;background:rgba(15,20,30,.6);padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5}
  #hud b{color:#ffd35a}
  #credit{position:fixed;right:10px;bottom:8px;color:rgba(255,255,255,.85);font-size:11px;text-shadow:0 1px 2px #0008}
  #load{position:fixed;inset:0;display:grid;place-items:center;background:#16202c;color:#fff;font-size:18px;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><b>T-Rex Test</b><br><span id="st">memuat model...</span><br>Seret = putar kamera · Scroll = zoom</div>
<div id="credit">"Tyrannosarus rex (Free model)" oleh Joel Anderson (Sketchfab) - CC BY-NC 4.0</div>
<div id="load">Memuat T-Rex...</div>

<script type="importmap">
{"imports":{"three":"./vendor/three-0.160.0.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd0f0);
scene.fog = new THREE.Fog(0x9fd0f0, 80, 220);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6a7a55, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50, near: 1, far: 150 });
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(120, 64).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x6f9a52, roughness: 1 })
);
ground.receiveShadow = true;
scene.add(ground);

// ---- kamera orbit sederhana ----
let camYaw = 0.6, camPitch = 0.28, camDist = 38, drag = false, lx = 0, ly = 0;
canvas.addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  camYaw -= (e.clientX - lx) * 0.006;
  camPitch = Math.min(1.2, Math.max(0.03, camPitch + (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
canvas.addEventListener('wheel', e => { camDist = Math.min(90, Math.max(12, camDist + e.deltaY * 0.03)); e.preventDefault(); }, { passive: false });
if (new URLSearchParams(location.search).has('autoorbit')) window.__autoOrbit = true;

// ---- model ----
const TARGET_LENGTH = 14;       // panjang T-Rex di dunia (satuan game), atur sesuai kebutuhan
const root = new THREE.Group(); // grup yang digerakkan (posisi + arah jalan)
const body = new THREE.Group(); // grup yang dibobbing/dimiringkan
root.add(body);
scene.add(root);

let jawPivot = null, headBox = null, ready = false, modelH = 1;

new GLTFLoader().load('./assets/trex.glb', (gltf) => {
  const model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = false; } });

  // 1) ukur, lalu pusatkan: kaki di y=0, tengah badan di x/z=0
  model.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const longAxis = size.x > size.z ? 'x' : 'z';
  const center = box.getCenter(new THREE.Vector3());

  // 2) cari rahang bawah: mesh tinggi-rendah terbesar di area kepala (Object_7 di file ini)
  let jaw = null, jawTris = 0;
  model.traverse(o => {
    if (!o.isMesh) return;
    const b = new THREE.Box3().setFromObject(o);
    const c = b.getCenter(new THREE.Vector3());
    const tris = (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3;
    const ahead = (c[longAxis] - center[longAxis]) / size[longAxis]; // + = ke arah kepala (atau ekor)
    if (tris > 5000 && tris < 40000 && Math.abs(ahead) > 0.3 && tris > jawTris) { jaw = o; jawTris = tris; }
  });

  // arah kepala = sisi tempat rahang berada
  let headSign = 1;
  if (jaw) {
    const jc = new THREE.Box3().setFromObject(jaw).getCenter(new THREE.Vector3());
    headSign = Math.sign(jc[longAxis] - center[longAxis]) || 1;
  }

  // 3) pasang pivot rahang di engsel (belakang rahang, bagian atas)
  if (jaw) {
    const jb = new THREE.Box3().setFromObject(jaw);
    const hinge = new THREE.Vector3((jb.min.x + jb.max.x) / 2, jb.max.y, (jb.min.z + jb.max.z) / 2);
    hinge[longAxis] = headSign > 0 ? jb.min[longAxis] : jb.max[longAxis];
    jawPivot = new THREE.Group();
    jaw.parent.add(jawPivot);
    jawPivot.position.copy(jaw.parent.worldToLocal(hinge.clone()));
    jawPivot.attach(jaw);
    jawPivot.userData.sign = headSign;
    jawPivot.userData.axis = longAxis;
  }

  // 4) bungkus supaya kepala menghadap -Z (depan standar three.js / Roblox)
  const align = new THREE.Group();
  align.add(model);
  // putar sumbu panjang ke Z, kepala ke -Z
  if (longAxis === 'x') align.rotation.y = headSign > 0 ? Math.PI / 2 : -Math.PI / 2;
  else align.rotation.y = headSign > 0 ? Math.PI : 0;
  body.add(align);

  // 5) skala & posisi akhir
  align.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(align);
  const s = TARGET_LENGTH / Math.max(box.getSize(new THREE.Vector3()).x, box.getSize(new THREE.Vector3()).z);
  align.scale.setScalar(s);
  align.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(align);
  const c2 = box.getCenter(new THREE.Vector3());
  align.position.set(-c2.x, -box.min.y, -c2.z);
  modelH = box.getSize(new THREE.Vector3()).y;

  document.getElementById('st').textContent = `siap · sumbu panjang ${longAxis.toUpperCase()} · rahang ${jaw ? 'ketemu' : 'TIDAK ketemu (hanya badan yang bergerak)'}`;
  document.getElementById('load').style.opacity = 0;
  setTimeout(() => document.getElementById('load').remove(), 500);
  ready = true;
  window.__trexInfo = { longAxis, headSign, hasJaw: !!jaw, length: TARGET_LENGTH, height: modelH };
}, undefined, (err) => {
  document.getElementById('load').textContent = 'Gagal memuat model. Jalankan lewat server (bukan file://). ' + (err && err.message || '');
  console.error(err);
});

// ---- animasi: berjalan melingkar + langkah berat + ekor/kepala + rahang ----
const PATH_R = 26, SPEED = 5.5; // satuan/detik
const clock = new THREE.Clock();
let t = 0;
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;

  if (ready) {
    const ang = window.__still ? 0 : (t * SPEED) / PATH_R;
    const px = Math.cos(ang) * PATH_R, pz = Math.sin(ang) * PATH_R;
    root.position.set(px, 0, pz);
    // arah jalan = garis singgung lingkaran (depan = -Z lokal)
    const tx = -Math.sin(ang), tz = Math.cos(ang);
    root.rotation.y = Math.atan2(-tx, -tz);

    // irama langkah: 1 langkah tiap ~1.1 detik
    const step = t * (Math.PI * 2 / 1.1);
    const bob = Math.abs(Math.sin(step));           // naik saat kaki bergantian
    body.position.y = bob * modelH * 0.035;
    body.rotation.z = Math.sin(step) * 0.045;        // miring kiri-kanan
    body.rotation.x = Math.sin(step * 2) * 0.012;    // hentakan kecil
    body.rotation.y = Math.sin(step * 0.5) * 0.035;  // badan menggeliat

    if (jawPivot) {
      // mengaum sesekali: 2 detik tertutup-bergetar, lalu buka lebar
      const cyc = (t % 7);
      let open = 0.05 + Math.sin(t * 3) * 0.02;
      if (cyc > 4.5 && cyc < 6.2) {
        const k = Math.sin(((cyc - 4.5) / 1.7) * Math.PI);
        open = 0.08 + k * 0.5;
      }
      // sumbu engsel = melintang terhadap sumbu panjang
      const a = jawPivot.userData.axis, sgn = jawPivot.userData.sign;
      // sudut positif pada sumbu yang tegak lurus panjang menurunkan ujung rahang
      if (a === 'z') jawPivot.rotation.x = open * sgn;
      else jawPivot.rotation.z = -open * sgn;
    }
  }

  // kamera
  if (window.__autoOrbit) camYaw += dt * 0.35;
  const target = ready ? root.position.clone().add(new THREE.Vector3(0, modelH * 0.45, 0)) : new THREE.Vector3(0, 4, 0);
  camera.position.set(
    target.x + Math.sin(camYaw) * Math.cos(camPitch) * camDist,
    target.y + Math.sin(camPitch) * camDist,
    target.z + Math.cos(camYaw) * Math.cos(camPitch) * camDist
  );
  camera.lookAt(target);

  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
window.__setTime = (v) => { t = v; };
</script>
</body>
</html>
